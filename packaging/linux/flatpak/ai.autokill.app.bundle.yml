# Flatpak manifest for the single-file bundle attached to every GitHub release
# (autokill-<version>-linux-<arch>.flatpak). Build it with packaging/linux/flatpak-bundle.sh.
#
# It repackages the release's own Linux tarball (autokill-<version>-linux-<arch>.tar.gz,
# built on Ubuntu 22.04 by package.sh) instead of compiling Rust inside flatpak-builder: no
# network and no vendored crate sources during the build, a few seconds instead of 20+ minutes,
# and byte-for-byte the same binaries as the AppImage/deb/rpm. The script unpacks the tarball
# into `stage/` next to a copy of this file. The binaries need glibc >= 2.35 and load X11,
# Wayland, xkbcommon and Vulkan at runtime; the freedesktop runtime has all of them, and the
# GPU driver comes from its org.freedesktop.Platform.GL extension.
#
# ai.autokill.app.yml (same directory) is the from-source manifest for Flathub. Keep
# runtime-version and finish-args identical in both (packaging-lint checks this).
id: ai.autokill.app
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: autokill
finish-args:
  # Honor the launcher's pinned and nightly version choices before offering updates.
  - --filesystem=xdg-data/ArtCraft/versions:ro
  # Verified update helpers run through flatpak-spawn --host.
  - --talk-name=org.freedesktop.Flatpak
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for the wgpu renderer (Vulkan, or GL as a fallback).
  - --device=dri
  # Open dialogs go through the file-chooser portal (rfd's xdg-portal backend) and drag-and-drop
  # through the document portal, so picked files work anywhere. Home is readable (never writable)
  # so files passed by path (the command line, recent targets) can be inspected.
  - --filesystem=home:ro
  # The default folder for new projects (`default_projects_dir`), writable and made if missing;
  # the rest of home stays read-only (#505).
  - --filesystem=xdg-documents/AutoKill:create
  # AI backends (Anthropic, OpenAI, OpenRouter, local servers) and optional engine downloads.
  - --share=network
modules:
  - name: autokill
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/autokill /app/bin/autokill
      # The headless CLI, in tarballs built with apps/autokill-cli.
      - if [ -x bin/autokill-cli ]; then install -Dm755 bin/autokill-cli /app/bin/autokill-cli; fi
      - install -Dm644 share/applications/ai.autokill.app.desktop /app/share/applications/ai.autokill.app.desktop
      # Already has the release's version and date substituted by package.sh.
      - install -Dm644 share/metainfo/ai.autokill.app.metainfo.xml /app/share/metainfo/ai.autokill.app.metainfo.xml
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/autokill /app/share/doc/
    sources:
      - type: dir
        path: stage
