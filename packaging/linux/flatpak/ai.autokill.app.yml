# Flatpak manifest for AutoKill, ready for a Flathub submission.
#
# Flatpak builds run offline, so the crate sources must be vendored first. From the repo root:
#
#   curl -fsSLO https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
#   python3 flatpak-cargo-generator.py Cargo.lock -o packaging/linux/flatpak/cargo-sources.json
#   flatpak-builder --user --install --force-clean build-flatpak packaging/linux/flatpak/ai.autokill.app.yml
#   flatpak run ai.autokill.app
#
# For Flathub, replace the `dir` source with a `git` source pinned to a release tag and commit.
# The single-file .flatpak attached to each release comes from ai.autokill.app.bundle.yml,
# which repackages the prebuilt release binaries. Keep runtime-version and finish-args identical.
id: ai.autokill.app
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: autokill
finish-args:
  # Honor the launcher's pinned and nightly version choices before offering updates.
  - --filesystem=xdg-data/ArtCraft/versions:ro
  # Verified update helpers run through flatpak-spawn --host.
  - --talk-name=org.freedesktop.Flatpak
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for the wgpu renderer (Vulkan, or GL as a fallback).
  - --device=dri
  # Open dialogs go through the file-chooser portal (rfd's xdg-portal backend) and drag-and-drop
  # through the document portal, so picked files work anywhere. Home is readable (never writable)
  # so files passed by path (the command line, recent targets) can be inspected.
  - --filesystem=home:ro
  # The default folder for new projects (`default_projects_dir`), writable and made if missing;
  # the rest of home stays read-only (#505).
  - --filesystem=xdg-documents/AutoKill:create
  # AI backends (Anthropic, OpenAI, OpenRouter, local servers) and optional engine downloads.
  - --share=network
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: autokill
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/autokill/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release --locked -p autokill -p autokill-cli
      - install -Dm755 target/release/autokill /app/bin/autokill
      - install -Dm755 target/release/autokill-cli /app/bin/autokill-cli
      - install -Dm644 packaging/linux/ai.autokill.app.desktop /app/share/applications/ai.autokill.app.desktop
      - mkdir -p /app/share/icons && cp -R assets/app-icon/hicolor /app/share/icons/
      - >-
        version=$(awk '/^\[/{p=($0=="[workspace.package]");next} p&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml);
        install -d /app/share/metainfo;
        sed -e "s/@VERSION@/$version/" -e "s/@DATE@/$(date -u +%Y-%m-%d)/"
        packaging/linux/ai.autokill.app.metainfo.xml.in > /app/share/metainfo/ai.autokill.app.metainfo.xml
    sources:
      - type: dir
        path: ../../..
        skip:
          - target
          - dist
          - corpus
          - build-flatpak
          - .flatpak-builder
      - cargo-sources.json
