[package]
name = "autokill-ai"
description = "AI backends, the agent loop and crews for AutoKill"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
schemars = { workspace = true }
autokill-evidence = { workspace = true }
autokill-engine = { workspace = true }
autokill-engines = { workspace = true }
autokill-formats = { workspace = true }
autokill-platform = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
toml = { workspace = true }
ureq = "3"
base64 = "0.23"
sha2 = "0.10"
yaml-rust2 = "0.10"
dirs = "6"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"
autokill-testkit = { workspace = true }